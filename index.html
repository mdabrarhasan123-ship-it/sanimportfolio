<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আবরার.নেট</title>

    <!-- Google Fonts for Bengali and English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ================= GLOBAL VARIABLES ================= */
        :root {
            --bg-color: #050505;
            --bg-secondary: #0b0b0f;
            --text-main: #f0f0f0;
            --text-muted: #8f8f8f;
            --accent-gold: #e5b567;
            --accent-gold-hover: #c99b52;
            --panel-bg: rgba(255, 255, 255, 0.036);
            --panel-border: rgba(255, 255, 255, 0.09);
            --panel-strong: rgba(255, 255, 255, 0.06);
            --font-bn: 'Hind Siliguri', sans-serif;
            --font-en: 'Space Grotesk', sans-serif;
            --shadow-glow: 0 12px 45px rgba(0, 0, 0, 0.35);
            --cursor-x: 50%;
            --cursor-y: 50%;
        }

        :root[data-theme="light"] {
            --bg-color: #f7f2e8;
            --bg-secondary: #f1e7d4;
            --text-main: #111111;
            --text-muted: #5e5e5e;
            --panel-bg: rgba(255, 255, 255, 0.58);
            --panel-border: rgba(17, 17, 17, 0.08);
            --panel-strong: rgba(17, 17, 17, 0.05);
            --shadow-glow: 0 18px 40px rgba(17, 17, 17, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-bn);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            transition: background 0.5s ease, color 0.5s ease;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at var(--cursor-x) var(--cursor-y), rgba(229, 181, 103, 0.16), transparent 25%),
                radial-gradient(circle at 15% 20%, rgba(229, 181, 103, 0.08), transparent 20%),
                radial-gradient(circle at 85% 10%, rgba(255,255,255,0.06), transparent 20%);
            opacity: 0.95;
            transition: background 0.2s ease;
        }

        body::after {
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 34px 34px;
            mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            opacity: 0.4;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        button { font: inherit; }

        /* ================= NAVBAR ================= */
        .navbar {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: min(1120px, calc(100% - 28px));
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 200;
            border-radius: 999px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--panel-border);
            box-shadow: 0 10px 35px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
            transition: all 0.35s ease;
        }

        .navbar.scrolled {
            top: 12px;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 20px 45px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .brand-area { display: flex; flex-direction: column; min-width: 150px; }

        .brand-name {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .brand-sub {
            font-size: 0.62rem;
            color: var(--text-muted);
            letter-spacing: 0.16em;
            font-family: var(--font-en);
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .nav-links a {
            color: var(--text-muted);
            font-size: 0.86rem;
            font-weight: 500;
            padding: 8px 12px;
            position: relative;
            border-radius: 999px;
            transition: all 0.25s ease;
            font-family: var(--font-en);
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent-gold);
            background: rgba(229,181,103,0.08);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 4px;
            width: 24px;
            height: 2px;
            transform: translateX(-50%) scaleX(0);
            transform-origin: center;
            background: var(--accent-gold);
            border-radius: 999px;
            transition: transform 0.25s ease;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            transform: translateX(-50%) scaleX(1);
        }

        .nav-controls { display: flex; gap: 10px; align-items: center; }

        .control-btn,
        .icon-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .control-btn {
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 0.74rem;
            font-family: var(--font-en);
            letter-spacing: 0.14em;
        }

        .control-btn.active {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .control-btn:hover,
        .icon-btn:hover {
            border-color: var(--accent-gold);
            transform: translateY(-2px);
        }

        .mobile-drawer {
            position: fixed;
            inset: 0 0 0 auto;
            width: min(320px, 90vw);
            padding: 90px 24px 24px;
            background: rgba(5,5,5,0.94);
            backdrop-filter: blur(24px);
            border-left: 1px solid var(--panel-border);
            transform: translateX(100%);
            transition: transform 0.35s ease;
            z-index: 180;
            display: none;
        }

        .navbar.open .mobile-drawer { transform: translateX(0); }

        .navbar.open {
            box-shadow: 0 20px 60px rgba(0,0,0,0.38);
        }

        .mobile-drawer .nav-links { flex-direction: column; align-items: flex-start; gap: 8px; }

        .mobile-drawer .nav-links a {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
        }

        .mobile-drawer .nav-links a.active {
            background: rgba(229,181,103,0.12);
        }

        /* ================= HERO SECTION ================= */
        .hero-section {
            position: relative;
            min-height: 100vh;
            padding: 130px 5% 70px;
            display: flex;
            align-items: center;
            overflow: hidden;
            isolation: isolate;
        }

        .hero-section::before,
        .hero-section::after {
            content: '';
            position: absolute;
            pointer-events: none;
            inset: auto;
            z-index: 1;
        }

        .hero-section::before {
            width: 640px;
            height: 640px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50%;
            right: -180px;
            bottom: -180px;
            animation: orbit 20s linear infinite;
        }

        .hero-section::after {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            left: 10%;
            top: 24%;
            background: radial-gradient(circle, rgba(229,181,103,0.16), transparent 70%);
            filter: blur(25px);
            animation: drift 8s ease-in-out infinite alternate;
        }

        .bg-wave {
            position: absolute;
            inset: -10% -20% auto auto;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, rgba(229,181,103,0.06), transparent 65%);
            filter: blur(14px);
            pointer-events: none;
            z-index: 1;
            opacity: 0.7;
        }

        .cursor-glow {
            position: fixed;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(229,181,103,0.2), transparent 70%);
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: screen;
            opacity: 0;
            transition: opacity 0.2s ease;
            transform: translate(-50%, -50%);
        }

        .hero-content-wrapper {
            display: grid;
            grid-template-columns: 1.1fr 0.95fr;
            gap: 40px;
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
            position: relative;
            z-index: 3;
            align-items: center;
        }

        .hero-text-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 20px;
            position: relative;
        }

        .hero-badge,
        .status-pill,
        .card-label {
            color: var(--accent-gold);
            font-size: 0.76rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            font-family: var(--font-en);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            width: fit-content;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--panel-border);
        }

        .hero-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-gold);
            box-shadow: 0 0 18px var(--accent-gold);
        }

        .main-title {
            font-size: clamp(2.6rem, 4.4vw, 4.8rem);
            font-weight: 700;
            line-height: 1.05;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .main-title span {
            color: var(--accent-gold);
        }

        .typing-text {
            font-size: clamp(1.18rem, 2vw, 1.65rem);
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .typing-text span {
            color: var(--text-main);
            border-right: 2px solid var(--accent-gold);
            padding-right: 6px;
            animation: blink 0.8s infinite;
        }

        .description {
            color: var(--text-muted);
            font-size: 1.04rem;
            line-height: 1.8;
            max-width: 620px;
            margin-bottom: 28px;
        }


        .btn-primary {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        .btn-primary:hover {
            background: transparent;
            color: var(--accent-gold);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border-color: var(--panel-border);
        }

        .btn-outline:hover {
            border-color: var(--text-main);
            background: rgba(255,255,255,0.04);
            transform: translateY(-2px);
        }

        .hero-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            margin-bottom: 24px;
        }

        .info-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 16px 20px;
            display: inline-flex;
            gap: 20px;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-glow);
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-family: var(--font-en);
        }

        .info-value {
            font-size: 0.94rem;
            color: var(--accent-gold);
            font-weight: 500;
            font-family: var(--font-en);
        }

        .info-value.bn-text {
            font-family: var(--font-bn);
            color: var(--text-main);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
        }

        .status-pill .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-gold);
            box-shadow: 0 0 12px var(--accent-gold);
            animation: pulse 1.7s ease-in-out infinite;
        }

        .hero-panel-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-top: 6px;
        }

        .hero-portrait-area {
            position: relative;
            min-height: 640px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            perspective: 1600px;
        }

        .hero-portrait-frame {
            position: relative;
            width: min(420px, 88%);
            height: min(720px, 86vh);
            border-radius: 36px;
            padding: 24px;
            background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.11);
            box-shadow: 0 30px 90px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
            overflow: hidden;
            transform: rotateY(-7deg) rotateX(4deg);
            transition: transform 0.3s ease;
        }

        .portrait-glow,
        .portrait-ring {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .portrait-glow {
            background: radial-gradient(circle at 30% 20%, rgba(229,181,103,0.25), transparent 35%);
            filter: blur(20px);
            animation: glowPulse 6s ease-in-out infinite alternate;
        }

        .portrait-ring {
            inset: 18px;
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 28px;
            animation: spinGlow 18s linear infinite;
        }

        .portrait-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            border-radius: 24px;
            position: relative;
            z-index: 2;
            filter: saturate(1.04) contrast(1.03);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
        }

        .portrait-badge {
            position: absolute;
            left: 24px;
            bottom: 24px;
            z-index: 3;
            padding: 12px 14px;
            border-radius: 16px;
            background: rgba(5,5,5,0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.12);
            font-size: 0.72rem;
            line-height: 1.45;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-main);
            font-family: var(--font-en);
        }

        .floating-card {
            position: absolute;
            z-index: 4;
            padding: 10px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(14px);
            font-family: var(--font-en);
            font-size: 0.76rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-main);
            box-shadow: var(--shadow-glow);
            animation: floatUp 4.5s ease-in-out infinite;
        }

        .floating-card.top { top: 60px; right: 18px; }
        .floating-card.bottom { bottom: 110px; left: 28px; animation-delay: 1s; }
        .floating-card.left { top: 170px; left: -14px; animation-delay: 2s; }

        .scroll-indicator {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            z-index: 4;
        }

        .scroll-indicator i {
            width: 24px;
            height: 38px;
            border: 1px solid var(--panel-border);
            border-radius: 999px;
            position: relative;
        }

        .scroll-indicator i::after {
            content: '';
            position: absolute;
            top: 7px;
            left: 50%;
            width: 4px;
            height: 8px;
            transform: translateX(-50%);
            border-radius: 999px;
            background: var(--accent-gold);
            animation: scroll 1.5s ease-in-out infinite;
        }

        
        /* ================= PERSONAL COMMAND CENTER ================= */
        .command-panel-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 220;
        }

        .command-panel-backdrop.open {
            opacity: 1;
            visibility: visible;
        }

        .command-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: min(420px, 95vw);
            height: 100vh;
            background: rgba(8, 8, 12, 0.96);
            border-left: 1px solid var(--panel-border);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            padding: 24px;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 230;
            overflow-y: auto;
        }

        .command-panel.open {
            transform: translateX(0);
        }

        .command-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .command-panel h3 {
            color: var(--accent-gold);
            margin-top: 6px;
            font-size: 1.2rem;
        }

        .command-group {
            margin-bottom: 18px;
        }

        .command-label {
            color: var(--accent-gold);
            font-size: 0.72rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-family: var(--font-en);
            margin-bottom: 8px;
            display: block;
        }

        .command-card,
        .command-mini,
        .command-nav-item,
        .command-search input {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 12px 14px;
        }

        .command-card strong {
            display: block;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .command-card p,
        .command-list li {
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .command-nav-list {
            display: grid;
            gap: 8px;
        }

        .command-nav-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
            transition: border-color 0.25s ease, transform 0.25s ease;
        }

        .command-nav-item:hover {
            border-color: var(--accent-gold);
            transform: translateX(2px);
        }

        .command-search input {
            width: 100%;
            color: var(--text-main);
            outline: none;
        }

        .command-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 18px;
        }

        .command-mini {
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            font-family: var(--font-en);
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .command-list {
            list-style: none;
            padding-left: 0;
            display: grid;
            gap: 8px;
        }

        .command-list li {
            padding-left: 12px;
            position: relative;
        }

        .command-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--accent-gold);
        }

        .hero-intro {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .hero-intro .hero-badge {
            margin-bottom: 0;
        }

        .accent-text {
            color: var(--accent-gold);
        }

        .identity-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .identity-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 140px;
        }

        .identity-card .card-title {
            margin-bottom: 0;
            font-size: 1rem;
        }

        .identity-meta {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-family: var(--font-en);
            font-size: 0.74rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .journey-shell,
        .learning-shell,
        .roots-shell,
        .philosophy-shell,
        .studio-shell,
        .connect-shell {
            display: grid;
            gap: 20px;
        }

        .journey-shell {
            grid-template-columns: 1.1fr 0.9fr;
        }

        .learning-shell {
            grid-template-columns: 1fr 1fr;
        }

        .roots-shell {
            grid-template-columns: 0.95fr 1.05fr;
        }

        .philosophy-shell {
            grid-template-columns: 1.1fr 0.9fr;
        }

        .studio-shell {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .connect-shell {
            grid-template-columns: 1.1fr 0.9fr;
        }

        .timeline-rail {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .timeline-entry {
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .timeline-entry:last-child {
            border-bottom: 0;
        }

        .timeline-entry strong {
            display: block;
            color: var(--accent-gold);
            margin-bottom: 6px;
        }

        .timeline-entry span {
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .learning-progress {
            display: grid;
            gap: 10px;
            margin-top: 14px;
        }

        .progress-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);

    <!-- HTML content continues here -->
    
    <script>
        function initNavbar() {
            const navbar = document.querySelector('.navbar');
            const navLinks = document.querySelectorAll('.nav-links a');
            const menuToggle = document.querySelector('.menu-toggle');

            // Navbar scroll effect
            window.addEventListener('scroll', () => {
                if (window.scrollY > 20) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });

            // NavLink click handling
            navLinks.forEach(link => {
                link.addEventListener('click', function () {
                    navLinks.forEach(item => item.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // Intersection Observer for section tracking
            const sectionObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const sectionId = entry.target.id;
                        
                        // Remove active from all links
                        navLinks.forEach(link => link.classList.remove('active'));
                        
                        // Add active to matching link
                        const activeLink = document.querySelector(`.nav-links a[href="#${sectionId}"]`);
                        if (activeLink) {
                            activeLink.classList.add('active');
                        }
                    }
                });
            }, { threshold: 0.45 });

            // Observe all sections
            document.querySelectorAll('section[id]').forEach(section => {
                sectionObserver.observe(section);
            });
        }

        function initHero() {
            const hero = document.querySelector('.hero-section');
            const portraitFrame = document.querySelector('.hero-portrait-frame');
            const glow = document.querySelector('.portrait-glow');

            if (!hero || !portraitFrame) return;

            let targetX = 0;
            let targetY = 0;
            let currentX = 0;
            let currentY = 0;
            let frameId = null;

            function updateFrame() {
                currentX += (targetX - currentX) * 0.12;
                currentY += (targetY - currentY) * 0.12;
                portraitFrame.style.transform = `rotateY(${(-7 + currentX * 10).toFixed(2)}deg) rotateX(${(4 - currentY * 10).toFixed(2)}deg) scale(${1 + Math.abs(currentX) * 0.006})`;
                if (glow) {
                    glow.style.transform = `translate3d(${currentX * 18}px, ${currentY * 18}px, 0)`;
                }
                document.documentElement.style.setProperty('--cursor-x', `${50 + currentX * 20}%`);
                document.documentElement.style.setProperty('--cursor-y', `${50 + currentY * 20}%`);
                if (Math.abs(targetX - currentX) < 0.001 && Math.abs(targetY - currentY) < 0.001) {
                    cancelAnimationFrame(frameId);
                    frameId = null;
                    return;
                }
                frameId = requestAnimationFrame(updateFrame);
            }

            function setInteraction(clientX, clientY) {
                const rect = hero.getBoundingClientRect();
                const x = ((clientX - rect.left) / rect.width - 0.5) * 2;
                const y = ((clientY - rect.top) / rect.height - 0.5) * 2;
                targetX = Math.max(-1, Math.min(1, x));
                targetY = Math.max(-1, Math.min(1, y));
                portraitFrame.classList.add('is-hovered');
                if (!frameId) frameId = requestAnimationFrame(updateFrame);
            }

            hero.addEventListener('pointermove', (event) => {
                setInteraction(event.clientX, event.clientY);
            });

            hero.addEventListener('pointerleave', () => {
                targetX = 0;
                targetY = 0;
                portraitFrame.classList.remove('is-hovered');
                if (!frameId) frameId = requestAnimationFrame(updateFrame);
            });

            hero.addEventListener('touchmove', (event) => {
                const touch = event.touches[0];
                if (touch) setInteraction(touch.clientX, touch.clientY);
            }, { passive: true });

            hero.addEventListener('touchend', () => {
                targetX = 0;
                targetY = 0;
                portraitFrame.classList.remove('is-hovered');
                if (!frameId) frameId = requestAnimationFrame(updateFrame);
            });
        }

        // Initialize on DOM load
        document.addEventListener('DOMContentLoaded', () => {
            initNavbar();
            initHero();
        });
    </script>
</body>
